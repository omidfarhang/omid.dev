- name: "Hanieh Dehghan"
  title: "Head of Product at Jibit"
  avatar: "/images/recommendations/hanieh-dehghan.jpeg"
  date: "2026-09-14"
  source: "linkedin"
  link: "https://www.linkedin.com/in/hanieh-dehghan/"
  text: |-
    Working alongside Omid at Jibit has been a highlight of my professional journey. As a Front-end Lead, he is not just a technical expert; he is a genuine mentor who has played a huge role in my growth by always sharing his knowledge and expertise.

    Omid is the anchor of our team. He strikes the perfect balance: he grants us the freedom to own our tasks, yet we all know he is the go-to person when a challenge needs a brilliant solution. And if you ever get a notification from him at 3 AM, don’t panic—it just means Omid has decided to refactor the entire architecture because he found a slightly ‘cleaner’ way to do it! That kind of relentless passion for quality is both hilarious and deeply inspiring.

    What I value most is his quiet, proactive reliability. You only need to mention a requirement once; without any follow-ups or reminders, it is handled with complete composure and precision. Having Omid on the team is a true source of professional security. I am genuinely grateful for the opportunity to work side-by-side with him.
