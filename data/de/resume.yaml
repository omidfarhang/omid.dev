summary: >
  Frontend-Architekt und Engineering Lead mit über 10 Jahren Erfahrung in der
  Entwicklung von Webplattformen an der Schnittstelle von Produkt, Architektur
  und Developer Experience. Mein Schwerpunkt liegt auf Angular und TypeScript
  sowie den zugehörigen Engineering-Systemen: Design-Systeme, Nx-Monorepos,
  Testing und CI/CD. Bei Jibit begann ich als einziger Angular-Entwickler,
  baute ein Team aus 3 Angular-Entwicklern und einem Webentwickler auf und verantworte
  heute die Plattform, auf der dieses Team arbeitet: rund 10 Angular-Anwendungen
  in einem Nx-Monorepo, ein gemeinsames Design-System und die dazugehörige
  CI/CD-Infrastruktur. Frühere Stationen umfassen die Migration von AngularJS
  zu Angular und von Laravel- zu Spring-Boot-APIs sowie Windows-Betrieb und
  Linux-Beratung.
