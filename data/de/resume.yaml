experience:
  - title: Lead Frontend Engineer & Team Lead
    company: Jibit
    period: Aug. 2019 - heute
    description: >
      Jibit ist ein B2B-FinTech-Unternehmen für Zahlungsinfrastruktur,
      Finanzdienstleistungen für Unternehmen und digitale Identitätsprüfung.
    responsibilities:
      - Als einziger Angular-Entwickler gestartet und durch Recruiting und Mentoring ein Team aus 3 Angular-Entwicklern und einem Webentwickler aufgebaut. Inzwischen unterstützen auch Partnerunternehmen ihre Frontend-Auswahl durch meine technischen Interviews.
      - Neue Angular-Portale entwickelt und ältere React-Anwendungen zunächst als eigenständige Repositories abgelöst; gemeinsam benötigte Funktionen für Backoffice- und Endkundenanwendungen anschließend über Git-Submodule geteilt.
      - Anwendungen, gemeinsam genutzte Module und Design-System unter Erhalt der Git-Historie in einem Nx-Monorepo konsolidiert (rund 10 Angular-Apps sowie Shared und Feature Libraries) und über mehrere Angular-Hauptversionen aktuell gehalten.
      - Gemeinsam mit dem UI/UX-Team ein einheitliches Design-System in Figma eingeführt, als Angular-Bibliothek mit Storybook und eigenen Generatoren umgesetzt und in den Angular-Anwendungen ausgerollt.
      - GitLab CI/CD für das Monorepo eigenständig konzipiert: änderungsbasierte Builds, geordnete Docker-Deployments und Shell-Tools. Dadurch CI-Laufzeiten um rund 50 % und Deployments von 15 auf unter 4 Minuten reduziert sowie tägliche Produktiv-Releases ermöglicht.
      - Unit-Tests von Jest auf Vitest umgestellt, E2E-Abdeckung mit Playwright ausgebaut und die Performance der Angular-Anwendungen kontinuierlich überwacht.
      - Neben den Angular-Anwendungen betreibt das Team auch die öffentliche Website und Entwicklerdokumentation: WordPress in Docker mit Caching, MariaDB-Tuning, PHP-Härtung und Frontend-Performance auf GTmetrix-A-Niveau.
