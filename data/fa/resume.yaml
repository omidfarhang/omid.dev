  - category: اکوسیستم فرانت‌اند
    items: [Angular (حرفه‌ای), TypeScript, RxJS, مدیریت وضعیت, کتابخانه‌های کامپوننت, Storybook, آزمون (Vitest/Jest/Playwright)]
  - category: بک‌ند و یکپارچه‌سازی
    items: [Node.js, NestJS, Express.js, Laravel, APIهای REST, gRPC, MySQL/MariaDB]
  - category: دواپس و امنیت
