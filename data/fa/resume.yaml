      - استقرار فرایند تحویل چابک مبتنی بر Jira؛ افزایش ۳۵٪ سرعت اسپرینت و کاهش ۲۰٪ گزارش‌های باگ.
      - انتقال آزمون‌های واحد از Jest به Vitest و کاهش ۷۰٪ زمان اجرای آن‌ها.
      - افزایش پوشش آزمون‌های سرتاسری Playwright به ۸۵٪.
      - بهینه‌سازی خط لوله‌های استقرار مبتنی بر Docker با همکاری تیم DevOps؛ کاهش زمان استقرار از ۱۵ دقیقه به کمتر از ۴ دقیقه و فراهم‌کردن امکان انتشار روزانه در محیط تولید.
      - گسترش تیم فرانت‌اند از ۱ به ۴ مهندس با حفظ نرخ ماندگاری ۱۰۰٪.
