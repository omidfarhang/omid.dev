experience:
  - title: مهندس ارشد فرانت‌اند و رهبر تیم
    company: جیبیت
    period: اوت ۲۰۱۹ - اکنون
    description: >
      جیبیت یک شرکت فین‌تک B2B در زمینه زیرساخت پرداخت، خدمات مالی سازمانی
      و احراز هویت دیجیتال است.
    responsibilities:
      - کار را به‌عنوان تنها توسعه‌دهنده Angular آغاز کردم و با استخدام و منتورینگ، تیمی شامل ۳ توسعه‌دهنده Angular و ۱ توسعه‌دهنده وب ساختم. اکنون شرکت‌های همکار نیز ارزیابی فنی استخدام‌های فرانت‌اند خود را به من می‌سپارند.
      - پنل‌های جدید را با Angular توسعه دادم و اپلیکیشن‌های قدیمی React را ابتدا در ریپازیتوری‌های مستقل جایگزین کردم؛ سپس با مشترک‌شدن قابلیت‌های پنل بک‌آفیس و کاربران، کد مشترک را از طریق Git Submodule به اشتراک گذاشتم.
      - اپلیکیشن‌ها، ماژول‌های مشترک و سیستم طراحی را با حفظ تاریخچه Git در یک مونو‌ریپوی Nx یکپارچه کردم؛ شامل حدود ۱۰ اپلیکیشن Angular، کتابخانه‌های مشترک و کتابخانه‌های قابلیت‌محور، با به‌روزرسانی مستمر در نسخه‌های اصلی Angular.
      - با همکاری تیم UI/UX یک سیستم طراحی یکپارچه در Figma شکل دادم، آن را به‌صورت کتابخانه Angular همراه با Storybook و Generatorهای اختصاصی پیاده‌سازی کردم و در اپلیکیشن‌های Angular به کار گرفتم.
      - معماری GitLab CI/CD مونو‌ریپو را به‌صورت مستقل طراحی کردم: ساخت مبتنی بر تغییرات، استقرار ترتیبی Docker و ابزارهای Shell. زمان CI حدود ۵۰٪ کاهش یافت، استقرار از ۱۵ دقیقه به کمتر از ۴ دقیقه رسید و انتشار روزانه در محیط عملیاتی ممکن شد.
      - آزمون‌های واحد را از Jest به Vitest منتقل کردم، پوشش E2E با Playwright را گسترش دادم و پایش کارایی اپلیکیشن‌های Angular را انجام دادم.
      - علاوه بر اپلیکیشن‌های Angular، تیم مسئول وب‌سایت عمومی و مستندات توسعه‌دهندگان نیز هست: WordPress روی Docker با کش، بهینه‌سازی MariaDB، سخت‌سازی PHP و کارایی فرانت‌اند در سطح A آزمون GTmetrix.
    skills: [رهبری مهندسی, منتورینگ, Angular, TypeScript, Nx, RxJS, Vitest, Playwright, Storybook, Docker, CI/CD, WordPress]
  - title: مشاور فنی / رهبر فنی
    company: رایمندان تالی پارسه
    period: ژوئن ۲۰۲۰ - مارس ۲۰۲۲
    description: >
      هم‌زمان با جیبیت. مشاوره فنی یک پروژه برج‌سازی شامل وب‌سایت عمومی،
      زیرساخت ایمیل و دوربین کارگاه برای خریداران.
    responsibilities:
      - نخستین VPS را به‌طور کامل برای سرویس ایمیل، MariaDB و وب‌سایت عمومی با طراحی اختصاصی راه‌اندازی کردم.
      - دوربین RTSP کارگاه را به لندینگ‌پیج عمومی متصل کردم: دریافت و تبدیل ویدئو به MP4 با FFmpeg روی ارتباط کم‌پهنای‌باند و پخش نهایی از طریق CDN.
      - پس از قطعی‌های اولیه، راهکار پشتیبان‌گیری و Failover را برای سرویس ایمیل و وب‌سایت پیاده‌سازی کردم.
    skills: [مشاوره فنی, Linux, Nginx, MariaDB, FFmpeg, RTSP, CDN, Ubuntu]
  - title: توسعه‌دهنده ارشد فرانت‌اند
    company: پولیتو
    period: نوامبر ۲۰۱۸ - اوت ۲۰۱۹
    description: >
      استارتاپ فین‌تک ارائه‌دهنده محصولات پرداخت برای کاربران و تیم‌های عملیاتی.
    responsibilities:
      - توسعه فرانت‌اند داشبوردهای مدیریتی و مشتری را برای عملیات روزمره پرداخت هدایت کردم.
      - لایه ارتباطی داده‌های مالی بلادرنگ را با Angular و gRPC طراحی و حجم داده را برای به‌روزرسانی‌های پرتکرار بهینه کردم.
      - صفحات بازاریابی و لندینگ‌پیج‌های واکنش‌گرا را برای کمپین‌های جذب مشتری پیاده‌سازی کردم.
    skills: [رهبری تیم, Angular, gRPC, TypeScript, CSS, RxJS]
  - title: توسعه‌دهنده ارشد فرانت‌اند
    company: مدرن‌پل
    period: اکتبر ۲۰۱۵ - نوامبر ۲۰۱۸
    description: >
      ارتقا از توسعه‌دهنده جونیور به لید. توسعه محصولات حوزه سلامت و مالی،
      از جمله پلتفرم تبادل ارز. ابتدا AngularJS و سپس Angular را وارد تیم کردم.
    responsibilities:
      - اپلیکیشن‌های عملیاتی AngularJS را توسعه دادم و سپس با توجه به مناسب‌نبودن ngUpgrade، آن‌ها را به‌صورت تدریجی با Angular 2+ بازنویسی کردم.
      - APIهای REST مبتنی بر Laravel را برای کلاینت‌های Angular توسعه دادم و سپس با حفظ قراردادهای API، آن‌ها را به Spring Boot منتقل کردم.
      - در کنار اپلیکیشن‌های محصول، وب‌سایت‌های WordPress را نیز توسعه و تحویل دادم.
      - مسیر فنی فرانت‌اند را تعیین کردم، توسعه‌دهندگان را منتور کردم و در تصمیم‌های فنی و محصولی با CTO همکاری داشتم.
    skills: [هدایت فنی, Angular, AngularJS, Laravel, PHP, Java, Spring Boot, WordPress, Gradle]
  - title: مدیر سیستم و توسعه‌دهنده وب
    company: شرکت مشاوره حاسب سیستم
    period: سپتامبر ۲۰۱۴ - نوامبر ۲۰۱۵
    description: >
      شرکت مشاوره مدیریت. کار را با راهبری زیرساخت ویندوز آغاز کردم و سپس
      توسعه اپلیکیشن‌های داخلی PHP نیز به مسئولیت‌هایم اضافه شد.
    responsibilities:
      - ارتباط WAN دفتر را پایدار کردم و Active Directory، DNS و TFS بیش از ۳۰ ایستگاه کاری را بازسازی و اصلاح کردم؛ سخت‌افزارها را به‌تدریج ارتقا دادم و به‌روزرسانی Windows، آنتی‌ویروس و نرم‌افزارها را متمرکز کردم.
      - دستگاه حضور و غیاب را تعویض و با نرم‌افزارهای داخلی یکپارچه کردم.
      - یک پرتال داخلی PHP/MariaDB برای ثبت کارکرد، تنخواه، حقوق‌ودستمزد و هزینه‌های مشترک توسعه دادم.
      - فهرست خدمات سلامت و انجمن گفت‌وگوی مبتنی بر PHP و phpBB را برای کارکنان و مشتریان راه‌اندازی کردم.
