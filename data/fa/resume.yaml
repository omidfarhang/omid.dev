summary: >
  معمار فرانت‌اند و مدیر مهندسی با بیش از ۱۰ سال تجربه در طراحی، توسعه و مقیاس‌دهی پلتفرم‌های وب پیچیده. سابقه هدایت تیم‌هایی تا ۱۵ نفر و دستیابی به نتایج قابل‌اندازه‌گیری: تحویل ۴۰٪ سریع‌تر با فریم‌ورک و سیستم طراحی مبتنی بر Angular، کاهش ۵۰٪ زمان ساخت در CI/CD پس از یکپارچه‌سازی در مونو‌ریپوی Nx، و کاهش زمان استقرار از ۱۵ به ۴ دقیقه با بهینه‌سازی خط لوله. مسلط به Angular و TypeScript، با تمرکز بر کارایی، آزمون و حکمرانی پلتفرم.
