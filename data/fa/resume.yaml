summary: >
  معمار فرانت‌اند و رهبر مهندسی با بیش از ۱۰ سال تجربه در توسعه پلتفرم‌های وب؛
  با تمرکز بر نقطه تلاقی محصول، معماری و تجربه توسعه‌دهنده. حوزه تخصصی من
  Angular و TypeScript و زیرساخت مهندسی پیرامون آن‌هاست: سیستم طراحی،
  مونو‌ریپوی Nx، آزمون و CI/CD. در جیبیت کار را به‌عنوان تنها توسعه‌دهنده
  Angular آغاز کردم، تیمی شامل ۳ توسعه‌دهنده Angular و ۱ توسعه‌دهنده وب
  ساختم و اکنون مسئول پلتفرم کاری این تیم هستم: حدود ۱۰ اپلیکیشن Angular
  در یک مونو‌ریپوی Nx، یک سیستم طراحی مشترک و زیرساخت CI/CD آن. تجربه‌های
  پیشینم شامل مهاجرت AngularJS به Angular و APIهای Laravel به Spring Boot،
  راهبری زیرساخت ویندوز و مشاوره فنی لینوکس است.
