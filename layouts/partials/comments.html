{{- if .Site.Params.comments -}}
<section class="comments-container" aria-labelledby="discussion-title">
    {{- partial "discussion_actions.html" . -}}

    <div id="webmentions" class="webmentions-container" data-url="{{ .Permalink }}">
        <div class="webmentions-header">
            <div id="webmentions-stats" class="webmentions-stats"></div>
            <div id="webmentions-facepile" class="webmentions-facepile"></div>
        </div>
        <div id="webmentions-list" class="webmentions-list"></div>
    </div>
</section>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const container = document.getElementById('webmentions');
    if (!container) return;

    const targetUrl = container.getAttribute('data-url');
    const statsContainer = document.getElementById('webmentions-stats');
    const facepileContainer = document.getElementById('webmentions-facepile');
    const listContainer = document.getElementById('webmentions-list');

    const labels = {
        likes: '{{ i18n "webmentions_likes" }}',
        reposts: '{{ i18n "webmentions_reposts" }}',
        mentions: '{{ i18n "webmentions_mentions" }}',
        none: '{{ i18n "no_webmentions" }}'
    };

    const replyLabels = {
        x: '{{ i18n "reply_on" (dict "Platform" "X") }}',
        mastodon: '{{ i18n "reply_on" (dict "Platform" "Mastodon") }}',
        bluesky: '{{ i18n "reply_on" (dict "Platform" "Bluesky") }}'
    };

    const PLATFORM_PATTERNS = {
        bluesky: /https:\/\/bsky\.app\/profile\/[^/#?]+\/post\/[^/#?]+/,
        mastodon: /https:\/\/[^/]+\/@[^/#?]+\/\d+/,
        x: /https:\/\/(?:x|twitter)\.com\/[^/#?]+\/status\/\d+/
    };

    function parseBridgyMastodon(raw) {
        const match = raw.match(/brid\.gy\/(?:like|repost|publish)\/mastodon\/@([^@]+)@([^/]+)\/(\d+)/);
        if (!match) return null;
        return `https://${match[2]}/@${match[1]}/${match[3]}`;
    }

    function extractSyndicationUrls(mentions) {
        const found = {};
        const earliest = {};

        mentions.forEach(function(m) {
            const received = m['wm-received'] ? new Date(m['wm-received']).getTime() : Infinity;
            const candidates = [
                m.url,
                m['wm-source'],
                m['mention-of'],
                m['in-reply-to'],
                m['repost-of']
            ].filter(Boolean);

            if (Array.isArray(m.syndication)) {
                candidates.push.apply(candidates, m.syndication);
            }

            candidates.forEach(function(raw) {
                Object.keys(PLATFORM_PATTERNS).forEach(function(platform) {
                    const match = raw.match(PLATFORM_PATTERNS[platform]);
                    if (match && (!earliest[platform] || received < earliest[platform])) {
                        found[platform] = match[0];
                        earliest[platform] = received;
                    }
                });

                const bridgyMastodon = parseBridgyMastodon(raw);
                if (bridgyMastodon && (!earliest.mastodon || received < earliest.mastodon)) {
                    found.mastodon = bridgyMastodon;
                    earliest.mastodon = received;
                }
            });
        });

        return found;
    }

    const syndicationLabels = {
        x: 'X',
        mastodon: 'Mastodon',
        bluesky: 'Bluesky',
        linkedin: 'LinkedIn'
    };

    function syncSyndicationLinks(urls) {
        const container = document.getElementById('syndication-links');
        if (!container) return;

        Object.keys(urls).forEach(function(platform) {
            const url = urls[platform];
            if (!url) return;

            let link = container.querySelector('.u-syndication[data-platform="' + platform + '"]');
            if (link) return;

            link = document.createElement('a');
            link.className = 'u-syndication';
            link.setAttribute('data-platform', platform);
            link.href = url;
            link.textContent = syndicationLabels[platform] || platform;
            container.appendChild(link);
        });
    }

    function applySyndicationLinks(urls) {
        document.querySelectorAll('.share-btn[data-platform]').forEach(function(chip) {
            if (chip.getAttribute('data-manual') === 'true') return;

            const platform = chip.getAttribute('data-platform');
            const url = urls[platform];
            if (!url) return;

            chip.href = url;
            const label = chip.querySelector('span');
            if (label && replyLabels[platform]) {
                label.textContent = replyLabels[platform];
            }
        });

        syncSyndicationLinks(urls);
    }

    fetch(`https://webmention.io/api/mentions.jf2?target=${encodeURIComponent(targetUrl)}`)
        .then(function(response) { return response.json(); })
        .then(function(data) {
            const mentions = data.children || [];

            applySyndicationLinks(extractSyndicationUrls(mentions));

            if (mentions.length === 0) {
                statsContainer.innerHTML = `<p class="no-mentions">${labels.none}</p>`;
                return;
            }

            const likes = mentions.filter(function(m) { return m['wm-property'] === 'like-of'; });
            const reposts = mentions.filter(function(m) {
                return m['wm-property'] === 'repost-of' || m['wm-property'] === 'bookmark-of';
            });
            const replies = mentions.filter(function(m) {
                return ['in-reply-to', 'mention-of', 'rsvp'].includes(m['wm-property']);
            });

            let statsHtml = '';
            if (likes.length) statsHtml += `<span><strong>${likes.length}</strong> ${labels.likes}</span>`;
            if (reposts.length) statsHtml += `<span><strong>${reposts.length}</strong> ${labels.reposts}</span>`;
            if (replies.length) statsHtml += `<span><strong>${replies.length}</strong> ${labels.mentions}</span>`;
            statsContainer.innerHTML = statsHtml;

            const pile = likes.concat(reposts);
            const uniquePile = [];
            const seen = new Set();
            pile.forEach(function(m) {
                if (!seen.has(m.author.url)) {
                    seen.add(m.author.url);
                    uniquePile.push(m);
                }
            });

            if (uniquePile.length) {
                facepileContainer.innerHTML = uniquePile.map(function(m) {
                    return `
                    <a href="${m.author.url}" target="_blank" rel="noopener noreferrer" title="${m.author.name}">
                        <img src="${m.author.photo}" alt="${m.author.name}" loading="lazy">
                    </a>`;
                }).join('');
            }

            if (replies.length) {
                listContainer.innerHTML = replies.map(function(m) {
                    return `
                    <div class="webmention-item">
                        <div class="webmention-author">
                            <a href="${m.author.url}" target="_blank" rel="noopener noreferrer">
                                <img src="${m.author.photo}" alt="${m.author.name}" loading="lazy">
                                <span>${m.author.name}</span>
                            </a>
                            <time datetime="${m.published}">${new Date(m.published).toLocaleDateString()}</time>
                        </div>
                        <div class="webmention-content">
                            ${m.content ? (m.content.html || m.content.text) : ''}
                        </div>
                    </div>`;
                }).join('');
            }
        })
        .catch(function(err) {
            console.error('Error fetching webmentions:', err);
        });
});
</script>
{{- end -}}
