{{- define "main" }}

{{ partial "pagefind_meta.html" . }}
<article class="note-single">
  <p class="note-back">
    <a href="{{ "notes" | absLangURL }}">
      <i class="fa-solid {{ if eq .Language.Direction "rtl" }}fa-arrow-right{{ else }}fa-arrow-left{{ end }}" aria-hidden="true"></i>
      {{ i18n "notes" | default "Notes" }}
    </a>
  </p>

  {{ partial "note_entry.html" (dict "page" . "standalone" true) }}
  {{ partial "webmentions.html" . }}
</article>

{{- partial "note_scripts.html" . -}}

{{- end }}
