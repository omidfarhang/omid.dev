{{- /* Theme switch radiogroup. Optional: class (extra classes on root).
   Defaults match JS (pref-theme || "system") so the radiogroup is correct before sync. */ -}}
{{- $class := .class | default "" -}}
<div class="theme-switch{{ with $class }} {{ . }}{{ end }}" role="radiogroup" aria-label="{{ i18n "theme_toggle" | default "Theme" }}">
    <button type="button" class="theme-switch__option" role="radio" data-theme="system"
        aria-checked="true" tabindex="0"
        aria-label="{{ i18n "theme_system" | default "System" }}"
        title="{{ i18n "theme_system" | default "System" }}">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
        </svg>
    </button>
    <button type="button" class="theme-switch__option" role="radio" data-theme="light"
        aria-checked="false" tabindex="-1"
        aria-label="{{ i18n "theme_light" | default "Light" }}"
        title="{{ i18n "theme_light" | default "Light" }}">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
    </button>
    <button type="button" class="theme-switch__option" role="radio" data-theme="dark"
        aria-checked="false" tabindex="-1"
        aria-label="{{ i18n "theme_dark" | default "Dark" }}"
        title="{{ i18n "theme_dark" | default "Dark" }}">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>
</div>
